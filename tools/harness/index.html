<!DOCTYPE html>
<html><head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"><meta charset="utf-8"><title>Meatball harness</title>
<link rel="stylesheet" href="/ext/style.css">
<style>body{font-family:sans-serif;margin:0}#sheld{width:700px;max-width:100vw}#chat{min-height:200px}.mes{border-bottom:1px solid #ddd;padding:4px}#extensions_settings2{width:520px;max-width:100vw}body:not(.show-settings) #extensions_settings2{display:none}dialog.popup{position:fixed;top:20px;left:20px;width:760px;max-height:85vh;overflow:auto;z-index:9999}</style>
</head><body>
<div id="sheld"><div id="chat"></div><div id="form_sheld"><textarea id="send_textarea"></textarea><div id="send_but"></div></div></div>
<div id="extensions_settings2"></div>
<script src="/harness/st-stub.js"></script>
<script type="module">
globalThis.__SS_TEST__ = {};
{ const q = new URLSearchParams(location.search); if (q.get('ext2')) { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = '/ext2/src/ext-status.css'; document.head.appendChild(l); const cls = q.get('ext2body'); if (cls) document.body.classList.add(cls); } }
// ?oldset=1 → 예전 판을 쓰던 사람처럼 확장 설정이 이미 있는 채로 시작 (업데이트로 받은 경우 · 새 기본값이 기존 사용자에게 어떻게 오는지 보는 시나리오용)
if (new URLSearchParams(location.search).get('oldset')) window.__st.extensionSettings.statussim = { enabled: true, contactReflect: 'detail', lastSeenVersion: '2.8.0', v27asked: true };
// ?preset={...} → 확장이 켜지기 전부터 이 설정으로 (켤 때 무엇을 불러오는지 보는 시나리오용 · 예전 판을 쓰던 사람으로 시작)
{ const ps = new URLSearchParams(location.search).get('preset'); if (ps) window.__st.extensionSettings.statussim = { enabled: true, lastSeenVersion: '2.9.0', v27asked: true, trFreeAsked: true, tidyAsked: true, ...JSON.parse(ps) }; }
// ?old=1 → 옛 미트볼 상태창이 같이 깔려 켜져 있는 사람 (스크립트 주소만 흉내)
if (new URLSearchParams(location.search).get('old')) { const sc = document.createElement('script'); sc.type = 'text/plain'; sc.setAttribute('src', '/scripts/extensions/third-party/meatballstats/index.js'); document.head.appendChild(sc); }
await import('/ext/index.js');
await SillyTavern.getContext().eventSource.emit('app_ready');
window.__ready = true;
</script>
</body></html>
